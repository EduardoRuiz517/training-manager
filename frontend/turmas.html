<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turmas - Training Manager LMS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>Training Manager LMS</h1>

    <p class="subtitulo">
        Sistema de Gestão de Aprendizagem Corporativa
    </p>

    <nav class="menu">
        <a href="index.html">Colaboradores</a>
        <a href="treinamentos.html">Treinamentos</a>
        <a class="ativo" href="turmas.html">Turmas</a>
    </nav>

    <h2>Cadastro de Turmas</h2>

    <form id="formTurma">

        <select id="treinamento_id" required>
            <option value="">Selecione o treinamento</option>
        </select>

        <input
            type="text"
            id="nome"
            placeholder="Nome da turma"
            required
        >

        <input
            type="date"
            id="data_inicio"
            required
        >

        <input
            type="date"
            id="data_fim"
        >

        <input
            type="time"
            id="horario"
        >

        <input
            type="text"
            id="local"
            placeholder="Local"
        >

        <input
            type="number"
            id="vagas"
            placeholder="Quantidade de vagas"
            min="1"
        >

        <button type="submit">
            Cadastrar Turma
        </button>

    </form>

    <p id="mensagem"></p>

    <h2>Turmas Cadastradas</h2>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Turma</th>
                <th>Treinamento</th>
                <th>Data</th>
                <th>Horário</th>
                <th>Local</th>
                <th>Vagas</th>
                <th>Status</th>
                <th>Ação</th>
            </tr>
        </thead>

        <tbody id="listaTurmas"></tbody>
    </table>

    <div id="areaParticipantes" style="display: none; margin-top: 40px;">

        <h2 id="tituloParticipantes">
            Participantes da Turma
        </h2>

        <form id="formMatricula">

            <select id="colaborador_id" required>
                <option value="">Selecione o colaborador</option>
            </select>

            <button type="submit">
                Adicionar Participante
            </button>

        </form>

        <p id="mensagemMatricula"></p>

        <h3>Participantes Matriculados</h3>

        <table>
            <thead>
                <tr>
                    <th>Colaborador</th>
                    <th>Matrícula</th>
                    <th>Status</th>
                </tr>
            </thead>

            <tbody id="listaParticipantes"></tbody>
        </table>

    </div>

</div>

<script src="turmas.js"></script>

</body>
</html>
